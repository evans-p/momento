name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build with java 21
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build project
        run: mvn clean install -DskipTests

  spotless:
    name: Spotless Check
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Spotless Check
        run: mvn spotless:check -DskipSpotless=false
