name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build with java 21
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and run tests
        run: mvn clean install -DskipTests
